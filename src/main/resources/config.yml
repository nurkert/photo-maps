# PhotoMaps configuration. Apply changes with /photomaps reload (the web server restarts if its address changed).

web:
  # Port of the built-in web server. Open it in your firewall/router if players are not in your local network.
  port: 8100
  # Address the web server listens on. 0.0.0.0 means every network interface.
  bind: "0.0.0.0"
  # Address the QR codes point to, as players' phones reach it, e.g. "https://photos.example.com:8100".
  # Empty: https://<lets-encrypt domain>:<port> if a domain is set below, else https://<this server's address>:<port>
  # (the local network address if server-ip is not set).
  public-url: ""

  # Pictures are uploaded over HTTPS (TLS 1.2/1.3), so nobody on the way can see them.
  https:
    enabled: true

    # The easy way to a trusted certificate: enter the domain that points to this server and PhotoMaps gets a free
    # certificate from Let's Encrypt by itself and renews it in time. By setting a domain you accept the Let's
    # Encrypt Subscriber Agreement (https://letsencrypt.org/repository/).
    lets-encrypt:
      domain: ""
      # Optional: Let's Encrypt may write here about your certificate.
      email: ""
      # Let's Encrypt checks the domain on port 80. PhotoMaps opens this port only for the few seconds that takes.
      # Ports below 1024 need root on Linux: forward port 80 of your router/firewall to e.g. 8080 and set 8080 here.
      challenge-port: 80
      # Test certificates (not trusted by phones) without Let's Encrypt's rate limits, for trying out the setup.
      staging: false

    # Or your own certificate files, e.g. from certbot (these win over lets-encrypt):
    #   certificate: "/etc/letsencrypt/live/photos.example.com/fullchain.pem"
    #   private-key: "/etc/letsencrypt/live/photos.example.com/privkey.pem"
    # Renewed files are picked up automatically. Instead of PEM files you can use a PKCS#12 key store.
    # Without any of these the plugin creates a self-signed certificate: still encrypted, but phones show a warning
    # once. With a lets-encrypt domain, that is only used for the minute until the real certificate arrives.
    certificate: ""
    private-key: ""
    keystore: ""
    keystore-password: ""
    # Only for development builds with a self-signed certificate (releases send the pack from GitHub): Minecraft
    # refuses packs from self-signed servers, so the (public, hash-checked) pack is offered on this plain HTTP port.
    pack-port: 8101

upload:
  # How long a scanned photo code stays valid, in minutes. Right-click the code to renew it.
  session-minutes: 15
  # The largest picture, counted in maps.
  max-columns: 5
  max-rows: 5
  # Survival: every map of a picture costs one empty map from the player's inventory.
  # Players with photomaps.unlimited and players in creative mode never pay.
  consume-empty-maps: true
  # One picture per photo code: after the upload the code is used up (it leaves the inventory, copies show "used") and
  # its link stops working. Craft a new code for the next picture.
  single-use: true

frames:
  # Clicking an empty item frame with one part of a picture hangs the other parts from your inventory into the
  # empty frames around it, in the right order.
  auto-place: true

recipe:
  enabled: true

resource-pack:
  # Sends the texture of the photo code to Java players, next to any other pack. Bedrock players get it from Geyser.
  enabled: true
  # Releases send the pack from their GitHub release, which every player can download. Set an URL here to host it
  # yourself, or merge it into your server resource pack and set enabled: false.
  url: ""
  required: false
  prompt: ""

bedrock:
  # Copies the Bedrock pack and the item mapping into Geyser's folders on startup.
  install-pack: true
