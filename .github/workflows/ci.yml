name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # compiles and runs the unit tests
      - name: Build
        run: mvn -B verify

      - name: Smoke test on Paper 1.21.4
        run: scripts/smoke-test.sh "$(ls target/PhotoMaps-*.jar | grep -v original | head -n 1)" 1.21.4

      - name: Smoke test on Paper 1.21.4 with Geyser and Floodgate
        run: scripts/smoke-test.sh "$(ls target/PhotoMaps-*.jar | grep -v original | head -n 1)" 1.21.4 geyser

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoMaps-${{ github.sha }}
          path: |
            target/PhotoMaps-*.jar
            !target/original-*.jar
            target/PhotoMaps-resourcepack-*.zip
            target/PhotoMaps-bedrock-*.mcpack
          if-no-files-found: error

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resource packs and web sprites are up to date
        run: |
          python3 scripts/generate_resourcepack.py
          # JSON only: PNG bytes may differ between zlib versions
          git diff --exit-code -- 'src/main/resourcepack/*.json' 'src/main/resourcepack/*.mcmeta'

      - name: Web interface scripts are valid
        run: node --check src/main/resources/web/app.js

  lets-encrypt:
    name: Let's Encrypt (against Pebble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Pebble is Let's Encrypt's test CA. The test domain points to 127.0.0.1 inside its container, so Pebble validates
      # the HTTP-01 challenge against the plugin's challenge server on port 5002. Pebble rejects 10% of the nonces to
      # exercise the client's retries.
      - name: Start Pebble
        run: |
          docker run -d --name pebble --network host --add-host photos.example.test:127.0.0.1 \
            -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=10 \
            ghcr.io/letsencrypt/pebble:latest -config test/config/pebble-config.json
          curl -fsSL -o /tmp/pebble.minica.pem \
            https://raw.githubusercontent.com/letsencrypt/pebble/v2.10.1/test/certs/pebble.minica.pem
          for i in $(seq 30); do curl -sf --cacert /tmp/pebble.minica.pem https://localhost:14000/dir && break; sleep 1; done

      - name: Get a certificate
        env:
          PEBBLE_DIRECTORY: https://localhost:14000/dir
          PEBBLE_CA: /tmp/pebble.minica.pem
          PEBBLE_CHALLENGE_PORT: '5002'
        run: |
          mvn -B test -Dtest=LetsEncryptTest -Dsurefire.failIfNoSpecifiedTests=false
          grep -q 'Failures: 0, Errors: 0, Skipped: 0' target/surefire-reports/*LetsEncryptTest.txt

      # annotations can be read without signing in, logs cannot
      - name: Report the failure
        if: failure()
        run: |
          annotate() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          echo "::error title=LetsEncryptTest::$(head -c 3000 target/surefire-reports/*LetsEncryptTest.txt 2>/dev/null | annotate)"
          echo "::error title=Pebble::$(docker logs pebble 2>&1 | tail -n 40 | annotate)"
