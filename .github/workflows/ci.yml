name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # compiles and runs the unit tests
      - name: Build
        run: mvn -B verify

      - name: Smoke test on Paper 1.21.4
        run: scripts/smoke-test.sh "$(ls target/PhotoMaps-*.jar | grep -v original | head -n 1)" 1.21.4

      - name: Smoke test on Paper 1.21.4 with Geyser and Floodgate
        run: scripts/smoke-test.sh "$(ls target/PhotoMaps-*.jar | grep -v original | head -n 1)" 1.21.4 geyser

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoMaps-${{ github.sha }}
          path: |
            target/PhotoMaps-*.jar
            !target/original-*.jar
            target/PhotoMaps-resourcepack-*.zip
            target/PhotoMaps-bedrock-*.mcpack
          if-no-files-found: error

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resource packs and web sprites are up to date
        run: |
          python3 scripts/generate_resourcepack.py
          # JSON only: PNG bytes may differ between zlib versions
          git diff --exit-code -- 'src/main/resourcepack/*.json' 'src/main/resourcepack/*.mcmeta'

      - name: Web interface scripts are valid
        run: node --check src/main/resources/web/app.js

  lets-encrypt:
    name: Let's Encrypt (against Pebble)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Pebble is Let's Encrypt's test CA; challtestsrv answers every DNS name with 127.0.0.1, so Pebble validates
      # the HTTP-01 challenge against the plugin's challenge server on port 5002. Pebble rejects 10% of the nonces
      # to exercise the client's retries.
      - name: Start Pebble
        run: |
          docker run -d --name challtestsrv --network host ghcr.io/letsencrypt/pebble-challtestsrv:latest \
            -defaultIPv4 127.0.0.1 -defaultIPv6 "" -dns01 127.0.0.1:8053 -management 127.0.0.1:8055 \
            -http01 "" -https01 "" -tlsalpn01 "" -doh ""
          docker run -d --name pebble --network host -e PEBBLE_VA_NOSLEEP=1 -e PEBBLE_WFE_NONCEREJECT=10 \
            ghcr.io/letsencrypt/pebble:latest -config test/config/pebble-config.json -dnsserver 127.0.0.1:8053
          curl -fsSL -o /tmp/pebble.minica.pem \
            https://raw.githubusercontent.com/letsencrypt/pebble/v2.10.1/test/certs/pebble.minica.pem
          for i in $(seq 30); do curl -sf --cacert /tmp/pebble.minica.pem https://localhost:14000/dir && break; sleep 1; done

      - name: Get a certificate
        env:
          PEBBLE_DIRECTORY: https://localhost:14000/dir
          PEBBLE_CA: /tmp/pebble.minica.pem
          PEBBLE_CHALLENGE_PORT: '5002'
        run: |
          mvn -B test -Dtest=LetsEncryptTest -Dsurefire.failIfNoSpecifiedTests=false
          grep -q 'Tests run: 3, Failures: 0, Errors: 0, Skipped: 0' target/surefire-reports/*LetsEncryptTest.txt

      - name: Pebble logs
        if: failure()
        run: docker logs pebble; docker logs challtestsrv
