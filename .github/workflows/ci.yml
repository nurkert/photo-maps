name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # compiles and runs the unit tests
      - name: Build
        run: mvn -B verify

      - name: Smoke test on Paper 1.21.4
        run: scripts/smoke-test.sh "$(ls target/PhotoMaps-*.jar | grep -v original | head -n 1)" 1.21.4

      - name: Smoke test on Paper 1.21.4 with Geyser and Floodgate
        run: scripts/smoke-test.sh "$(ls target/PhotoMaps-*.jar | grep -v original | head -n 1)" 1.21.4 geyser

      - uses: actions/upload-artifact@v7
        with:
          name: PhotoMaps-${{ github.sha }}
          path: |
            target/PhotoMaps-*.jar
            !target/original-*.jar
            target/PhotoMaps-resourcepack-*.zip
            target/PhotoMaps-bedrock-*.mcpack
          if-no-files-found: error

  generated:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resource packs and web sprites are up to date
        run: |
          python3 scripts/generate_resourcepack.py
          # JSON only: PNG bytes may differ between zlib versions
          git diff --exit-code -- 'src/main/resourcepack/*.json' 'src/main/resourcepack/*.mcmeta'

      - name: Web interface scripts are valid
        run: node --check src/main/resources/web/app.js
