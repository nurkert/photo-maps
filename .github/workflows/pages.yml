name: Website

on:
  push:
    branches: [main]
    paths: ['site/**', 'images/**', 'docs/**', 'README.md', 'CHANGELOG.md', 'scripts/build_wiki.py',
            'src/main/resources/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy the website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # the landing page, the screenshots, the font and the pixel art of the plugin, and the wiki from docs/
      - name: Build the site
        run: |
          pip install markdown==3.7
          python3 scripts/build_site.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
